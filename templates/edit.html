<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Tugas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="mb-4">Edit Tugas</h2>

                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form action="{{ url_for('edit_tugas', id=tugas.id) }}" method="POST">
                            <div class="mb-3">
                                <label for="nama_tugas" class="form-label">Nama Tugas</label>
                                <input type="text" class="form-control" id="nama_tugas" name="nama_tugas" value="{{ tugas.nama_tugas }}" required>
                            </div>

                            <div class="mb-3">
                                <label for="deskripsi_tugas" class="form-label">Deskripsi</label>
                                <textarea class="form-control" id="deskripsi_tugas" name="deskripsi_tugas" rows="3">{{ tugas.deskripsi_tugas or '' }}</textarea>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="tenggat_waktu" class="form-label">Tenggat Waktu</label>
                                    <input type="datetime-local" class="form-control" id="tenggat_waktu" name="tenggat_waktu" value="{{ tugas.tenggat_waktu.strftime('%Y-%m-%dT%H:%M') }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="prioritas" class="form-label">Prioritas</label>
                                    <select class="form-select" id="prioritas" name="prioritas">
                                        <option value="Rendah" {% if tugas.prioritas == 'Rendah' %}selected{% endif %}>Rendah</option>
                                        <option value="Medium" {% if tugas.prioritas == 'Medium' %}selected{% endif %}>Medium</option>
                                        <option value="Tinggi" {% if tugas.prioritas == 'Tinggi' %}selected{% endif %}>Tinggi</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mt-3">
                                <label for="kategori_id" class="form-label">Kategori Proyek</label>
                                <select class="form-select" id="kategori_id" name="kategori_id" required>
                                    {% for kat in kategori %}
                                        <option value="{{ kat.id }}" {% if kat.id == tugas.kategori_id %}selected{% endif %}>{{ kat.nama_kategori }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Kembali</a>
                                <button type="submit" class="btn btn-primary">Perbarui Tugas</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
